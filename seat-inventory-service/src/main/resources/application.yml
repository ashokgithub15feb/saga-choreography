spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # database per service: only seat-inventory-service uses seat_inventory_db (created on first start if missing)
    url: jdbc:mysql://localhost:3306/seat_inventory_db?createDatabaseIfNotExist=true
    username: root
    password: root

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true

#  sql:
#    init:
#      mode: always

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:lkc-w76xqmg.ap-south-1.aws.public.confluent.cloud:9092}
    # Confluent Cloud only accepts SASL_SSL with an API key/secret (create one under the cluster's "API Keys").
    # spring.kafka.properties.* applies to the producer, consumer and admin clients.
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: PLAIN
      sasl.jaas.config: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="${CONFLUENT_API_KEY}" password="${CONFLUENT_API_SECRET}";'
      client.dns.lookup: use_all_dns_ips
      session.timeout.ms: 45000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # Kafka transactions: makes the producer transactional + idempotent (exactly-once within Kafka).
      # Spring Boot then auto-creates a KafkaTransactionManager and plugs it into the listener container.
      # Prefix must be unique per running instance, hence the random part.
      transaction-id-prefix: seat-inventory-tx-${random.uuid}
      acks: all
    consumer:
      group-id: seat-event-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # offsets are committed by the container (inside the Kafka transaction), never auto-committed
      enable-auto-commit: false
      # only read messages from committed transactions (aborted/in-flight writes are skipped)
      isolation-level: read-committed
      # ErrorHandlingDeserializer wraps JsonDeserializer: unreadable JSON (poison pill) becomes a
      # DeserializationException handed to the error handler -> DLT, instead of an endless poll loop
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
    listener:
      # listeners receive an Acknowledgment and call acknowledge() after successful processing
      ack-mode: manual

# Saga timeout: a LOCKED seat is released if payment hasn't answered within the TTL
seat:
  lock:
    ttl: PT5M
    sweep-interval: PT30S

# Publish OpenAPI 3.0 (springdoc 2.8 defaults to 3.1): readable by every Swagger UI / client generator
springdoc:
  api-docs:
    version: openapi_3_0
